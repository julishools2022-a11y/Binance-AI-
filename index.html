<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Alert & Analysis Agent — Binance Agent OS</title>
<style>
  :root {
    --yellow: #F0B90B;
    --yellow-dim: #C99400;
    --black: #0B0E11;
    --card: #14151A;
    --border: #2B2F36;
    --border-glow: rgba(240,185,11,0.35);
    --text: #EAECEF;
    --muted: #848E9C;
    --up: #0ECB81;
    --down: #F6465D;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--black);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 60px;
  }

  /* Banner — Binance yellow, bold, poster-style */
  .banner {
    background: var(--yellow);
    color: #000;
    padding: 28px 20px 34px;
    text-align: left;
  }
  .banner .eyebrow {
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    opacity: 0.75;
    margin-bottom: 6px;
  }
  .banner h1 {
    margin: 0 0 6px;
    font-size: 1.7rem;
    font-weight: 800;
    line-height: 1.15;
  }
  .banner p {
    margin: 0;
    font-size: 0.9rem;
    font-weight: 500;
    opacity: 0.85;
  }

  /* Category badge, styled like the workflow cards in the hackathon poster */
  .category-card {
    max-width: 720px;
    margin: -18px auto 24px;
    background: var(--black);
    border: 1px solid var(--yellow);
    border-radius: 14px;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 0 24px var(--border-glow);
  }
  .category-icon {
    background: var(--yellow);
    border-radius: 10px;
    width: 38px;
    height: 38px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
  }
  .category-text .label {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--yellow);
  }
  .category-text .sub {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .status-row {
    max-width: 720px;
    margin: 0 auto 20px;
    padding: 0 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 0.8rem;
    color: var(--muted);
  }
  .pill b { color: var(--text); }
  #refresh {
    background: var(--yellow);
    color: #000;
    border: none;
    border-radius: 999px;
    padding: 7px 18px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    margin-left: auto;
  }
  #refresh:active { background: var(--yellow-dim); }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--yellow);
    border-radius: 12px;
    padding: 16px 18px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .symbol {
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: 0.01em;
  }
  .badge {
    font-size: 0.68rem;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge.price_move { background: rgba(240,185,11,0.15); color: var(--yellow); }
  .badge.volume_spike { background: rgba(14,203,129,0.15); color: var(--up); }
  .trigger-detail {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 8px;
  }
  .explanation {
    font-size: 0.92rem;
    line-height: 1.55;
    color: var(--text);
  }
  .timestamp {
    color: var(--muted);
    font-size: 0.73rem;
    margin-top: 12px;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .empty, .loading, .error {
    text-align: center;
    color: var(--muted);
    padding: 50px 20px;
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .error { color: var(--down); border-color: var(--down); }
  footer {
    max-width: 720px;
    margin: 30px auto 0;
    padding: 0 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.75rem;
  }
  footer .highlight { color: var(--yellow); font-weight: 600; }
</style>
</head>
<body>

<div class="banner">
  <div class="eyebrow">Binance Agent OS · Track A</div>
  <h1>⚡ Alert & Analysis Agent</h1>
  <p>Real-time market moves, explained in plain language by AI.</p>
</div>

<div class="category-card">
  <div class="category-icon">📊</div>
  <div class="category-text">
    <div class="label">Data & Analysis</div>
    <div class="sub">Reports · Market Analysis · Portfolio Insights</div>
  </div>
</div>

<div class="status-row">
  <span class="pill" id="count-pill">Loading…</span>
  <span class="pill" id="latest-pill"></span>
  <button id="refresh">Refresh</button>
</div>

<main id="alerts-container">
  <div class="loading">Loading alerts…</div>
</main>

<footer>
  Built for the <span class="highlight">Binance Agent OS Mini Hackathon</span> — Track A
</footer>

<script>
  const SUPABASE_URL = "https://qgyuqwfzhodbyfemwxbw.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Xm3Qec0YaKJ2nVz6LQ0qzw_uMXVLYoX";

  const container = document.getElementById("alerts-container");
  const countPill = document.getElementById("count-pill");
  const latestPill = document.getElementById("latest-pill");
  const refreshBtn = document.getElementById("refresh");

  function timeAgo(iso) {
    const diffMs = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diffMs / 60000);
    if (mins < 1) return "just now";
    if (mins < 60) return `${mins}m ago`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}h ago`;
    return `${Math.floor(hrs / 24)}d ago`;
  }

  function renderAlerts(alerts) {
    if (!alerts.length) {
      container.innerHTML = `<div class="empty">No alerts logged yet. Once the agent runs and a trigger fires, it'll show up here.</div>`;
      countPill.textContent = "0 alerts";
      latestPill.textContent = "";
      return;
    }

    countPill.innerHTML = `<b>${alerts.length}</b> alert${alerts.length === 1 ? "" : "s"}`;
    latestPill.textContent = `Latest: ${timeAgo(alerts[0].created_at)}`;

    container.innerHTML = alerts.map(a => `
      <div class="card">
        <div class="card-top">
          <span class="symbol">${a.symbol}</span>
          <span class="badge ${a.trigger_type}">${a.trigger_type.replace("_", " ")}</span>
        </div>
        <div class="trigger-detail">${a.trigger_detail || ""}</div>
        <div class="explanation">${a.explanation || ""}</div>
        <div class="timestamp">${timeAgo(a.created_at)} · ${new Date(a.created_at).toLocaleString()}</div>
      </div>
    `).join("");
  }

  async function loadAlerts() {
    container.innerHTML = `<div class="loading">Loading alerts…</div>`;
    try {
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/agent_alerts?select=*&order=created_at.desc&limit=50`,
        {
          headers: {
            apikey: SUPABASE_ANON_KEY,
            Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
          },
        }
      );
      if (!res.ok) throw new Error(`Supabase error ${res.status}`);
      const data = await res.json();
      renderAlerts(data);
    } catch (err) {
      container.innerHTML = `<div class="error">Failed to load alerts: ${err.message}</div>`;
    }
  }

  refreshBtn.addEventListener("click", loadAlerts);
  loadAlerts();
</script>

</body>
</html>
